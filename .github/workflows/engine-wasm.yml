name: WASM Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Mathematical Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4'
          cabal-version: '3.10'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cabal/store
          key: ${{ runner.os }}-cabal-${{ hashFiles('package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Run tests
        run: |
          cabal update
          cabal test

  build-wasm:
    name: Compile Engine to WASM
    runs-on: ubuntu-latest
    needs: test
    container:
      image: ghcr.io/ghc-wasm-meta/ghc-9.6-wasm-wasi-ubuntu22.04:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile to WASM
        run: |
          wasm32-wasi-ghc src/Main.hs \
            -o Engine.wasm \
            -no-hs-main \
            -optl-Wl,--export=run_decomposition \
            -optl-Wl,--export=free_haskell_string \
            -optl-Wl,--export=hs_init \
            -optl-Wl,--export=malloc \
            -optl-Wl,--export=free

      - name: Upload WASM Package
        uses: actions/upload-artifact@v4
        with:
          name: hodge-decomposition-engine
          path: Engine.wasm


