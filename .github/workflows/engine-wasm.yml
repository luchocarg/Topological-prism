name: WASM Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-wasm:
    name: Compile Engine to WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GHC WASM
        uses: tweag/setup-ghc-wasm@v1
        with:
          ghc-version: '9.6'

      - name: Compile to WASM
        run: |
          wasm32-wasi-ghc src/Main.hs \
            -O2 \
            -o Engine.wasm \
            -no-hs-main \
            -optl-Wl,--export=run_decomposition \
            -optl-Wl,--export=free_haskell_string \
            -optl-Wl,--export=hs_init \
            -optl-Wl,--export=malloc \
            -optl-Wl,--export=free

      - name: Upload WASM Package
        uses: actions/upload-artifact@v4
        with:
          name: hodge-decomposition-engine
          path: Engine.wasm
          if-no-files-found: error